[project]
name = "molcore"
version = "0.1.0"
description = "Core functionality for SMLM Apps"
readme = "README.md"
authors = [
    { name = "Piers Turner", email = "piers.turner@physics.ox.ac.uk" }
]
requires-python = ">=3.12"
dependencies = [
    "astropy",
    "dask[array]",
    "h5py",
    "numpy",
    "pyyaml",
    "scipy",
    "threadpoolctl",
    "tifffile",
]

[project.optional-dependencies]
ui = ["qtpy>=2.4", "pyqtgraph>=0.13"]
localisation = ["picassosr>=0.11,<0.12"]
tracking = ["trackpy>=0.7,<0.8"]
segmentation = ["cellpose>=3.0,<3.1"]
clustering = ["scikit-learn"]
all = [
    "picassosr>=0.11,<0.12",
    "trackpy>=0.7,<0.8",
    "cellpose>=3.0,<3.1",
    "scikit-learn",
    "qtpy>=2.4",
    "pyqtgraph>=0.13",
]




[dependency-groups]
dev = ["ruff", "mypy>=1.15", "black", "isort", "docformatter"]

[tool.mypy]
python_version = "3.12"
files = [
    "src/molcore/backends.py",
    "src/molcore/execution.py",
    "src/molcore/revisions.py",
    "src/molcore/types/batches.py",
    "src/molcore/types/storage.py",
    "tests/typing_consumer.py",
]
follow_imports = "silent"
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
