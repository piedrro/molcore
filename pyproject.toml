[project]
name = "molcore"
version = "0.1.0"
description = "Core functionality for SMLM Apps"
readme = "README.md"
authors = [
    { name = "Piers Turner", email = "piers.turner@physics.ox.ac.uk" }
]
requires-python = ">=3.12"
dependencies = [
    "astropy",
    "cellpose>=4.2,<5",
    "dask[array]",
    "h5py",
    "numpy",
    "picassosr>=0.11,<0.12",
    "pyyaml",
    "scipy",
    "threadpoolctl",
    "tifffile",
]

[dependency-groups]
dev = ["ruff"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
